<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | NPK Advisor</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <span class="logo">🌱</span>
      <span>NPK Advisor</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="register.html" class="active">Register</a>
      <a href="guidelines.html">Guidelines</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Welcome</h1>
      <p>Login or create an account to continue</p>

      <div class="tab-buttons">
        <button class="tab-btn active" onclick="showForm('login')">Login</button>
        <button class="tab-btn" onclick="showForm('signup')">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form active-form">
        <label>Username</label>
        <input type="text" name="login-username" placeholder="Enter username" required />

        <label>Password</label>
        <div class="password-box">
          <input type="password" id="login-password" placeholder="Enter password" required />
          <button type="button" onclick="togglePassword('login-password', this)">Show</button>
        </div>

        <button class="submit-btn" type="submit">Login</button>
      </form>

      <form id="signup-form" class="auth-form">
        <label>Username</label>
        <input type="text" name="signup-username" placeholder="Choose username" required />

        <label>Email</label>
        <input type="email" name="signup-email" placeholder="Enter email" required />

        <label>Password</label>
        <div class="password-box">
          <input type="password" id="signup-password" placeholder="Create password" required />
          <button type="button" onclick="togglePassword('signup-password', this)">Show</button>
        </div>

        <label>Confirm Password</label>
        <div class="password-box">
          <input type="password" id="confirm-password" placeholder="Confirm password" required />
          <button type="button" onclick="togglePassword('confirm-password', this)">Show</button>
        </div>

        <button class="submit-btn" type="submit">Create Account</button>
      </form>
    </section>
  </main>

  <script src="register.js"></script>
</body>
</html>
